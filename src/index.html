<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도덕 - 질문 분석기</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>
</head>
<body>
    <div class="page">

        <!-- 질문하기 -->
        <section class="tab-panel" data-panel="ask">
            <p id="title">질문 분석기</p>
            <label class="field-label" for="name">이름</label>
            <input type="text" id="name" placeholder="이름을 입력해주세요">
            <label class="field-label" for="usr">질문</label>
            <input type="text" id="usr" placeholder="궁금한 질문을 입력해주세요">
            <div class="container">
                <strong class="stage">N단계</strong>
                <strong class="lv">제출 버튼을 눌러서 채점을 받아보세요.</strong>
                <p class="detail">상세설명이 여기에 나와요</p>
                <p class="advice"></p>
            </div>
            <button id="submit">제출</button>
        </section>

        <!-- 질문 기록 -->
        <section class="tab-panel" data-panel="history">
            <p id="title">질문 기록</p>
            <p class="home-desc">서버가 켜져 있는 동안 이 브라우저에서 남긴 질문 기록이에요.</p>
            <ul class="history-list" id="history-list"></ul>
        </section>

        <!-- 질문의 전당 -->
        <section class="tab-panel" data-panel="hof">
            <p id="title">🏆 질문의 전당</p>
            <p class="home-desc">현재 세션에서 가장 높은 사고 수준 점수를 기록한 질문들이에요.</p>
            <ol class="hof-list" id="hof-list"></ol>
            <button id="reset-hof" class="reset-btn">리더보드 초기화</button>
        </section>

    </div>

    <!-- 리더보드 초기화 비밀번호 모달 -->
    <div class="modal-backdrop" id="reset-modal" hidden>
        <div class="modal-box">
            <p class="modal-title">리더보드 초기화</p>
            <p class="modal-desc">비밀번호를 입력하세요.</p>
            <div class="modal-input-wrap">
                <input type="password" id="reset-password" class="modal-input" autocomplete="off">
                <div class="modal-input-mask" id="reset-mask" aria-hidden="true"></div>
            </div>
            <p class="modal-error" id="reset-error"></p>
            <div class="modal-actions">
                <button id="reset-cancel" class="modal-btn modal-btn-ghost">취소</button>
                <button id="reset-confirm" class="modal-btn modal-btn-primary">확인</button>
            </div>
        </div>
    </div>

    <nav class="tabbar">
        <button class="tabbar-item" data-tab="ask">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.33c-.77.32-1.4.9-1.4 1.67v.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.7" r="1" fill="currentColor"/></svg>
            <span>질문하기</span>
        </button>
        <button class="tabbar-item" data-tab="history">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 12a9 9 0 1 0 3-6.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 4v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>질문 기록</span>
        </button>
        <button class="tabbar-item" data-tab="hof">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 5H4v1a3 3 0 0 0 3 3M17 5h3v1a3 3 0 0 1-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 13v3M9 20h6M10 17h4v3h-4v-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span>질문의 전당</span>
        </button>
    </nav>
</body>
</html>
